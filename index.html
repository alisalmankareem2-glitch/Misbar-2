  body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f5f5;color:#333}

  #toast.show{display:block}
  .b{border:none;background:#eee;padding:6px 12px;border-radius:4px;margin:4px;cursor:pointer}

  .blk-textbox:focus{outline:none;border-color:#4d90fe;background:#fff}
  .resize-handle{position:absolute;width:8px;height:8px;background:#4d90fe;border-radius:50%;right:-4px;bottom:-4px;cursor:se-resize}
  .drag-handle{position:absolute;width:100%;height:100%;cursor:move}
</style>
